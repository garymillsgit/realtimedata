<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real-Time Temperature Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    .value {
      font-size: 64px;
      color: #2c7a7b;
      margin-top: 20px;
    }
    .timestamp {
      font-size: 18px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Simulated Temperature Sensor</h1>
  <div class="value" id="temp">-- °C</div>
  <div class="timestamp" id="time">--</div>

  <script>
    function generateFakeData() {
      const temp = (20 + Math.random() * 10).toFixed(2);
      const now = new Date().toLocaleTimeString();
      document.getElementById('temp').textContent = `${temp} °C`;
      document.getElementById('time').textContent = `Updated at ${now}`;
    }

    setInterval(generateFakeData, 1000);
    generateFakeData();
  </script>
</body>
</html>
